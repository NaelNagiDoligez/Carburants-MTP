[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carburants"
version = "0.9.0"
description = "Pipeline d'historisation des prix des carburants en France et site mobile Plein Sud"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Bornes hautes : une version majeure ne doit pas arriver dans la collecte sans passer par les tests.
    "pandas>=2.2,<4",
    "pyarrow>=15",
    "numpy>=1.26,<3",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
app = ["streamlit>=1.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
