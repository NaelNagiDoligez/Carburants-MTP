name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,app]"
      - run: ruff check .
      - run: pytest -q
      - name: Tests du site (classement)
        run: node --test web/tests/*.test.mjs
