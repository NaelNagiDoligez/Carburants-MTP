name: Ingestion prix carburants

on:
  schedule:
    # Toutes les 6 h (UTC). GitHub peut retarder ou sauter un déclenchement : c'est normal.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Snapshot
        run: python -m carburants run
      - name: Positions OpenStreetMap (12 départements par passage, chacun une fois par semaine)
        continue-on-error: true
        timeout-minutes: 25
        run: python -m carburants osm
      - name: Commit des nouvelles données
        run: |
          git config user.name "carburants-bot"
          git config user.email "carburants-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
